<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>设置 · 界面与动效预览</title>
<style>
  :root{
    --sb:env(safe-area-inset-top,0px);--ease:cubic-bezier(.2,.8,.2,1);--dur:.3s;
    --bar-dur:.42s;--bar-ease:cubic-bezier(.1,.8,.2,1);--sfade:.2s;
    --row-h:57px;--ico-size:34px;--glyph:19px;--knob:#FFF;
  }
  :root,[data-theme=light]{
    --bg:#EFF0F3;--card:#FFF;--text:#17171A;--text2:#8E8F92;--text3:#9A9A9E;--sep:#EFEFEF;
    --search:#DFE0E3;--chev:#C6C6CB;--switch-off:#D8D8DC;--bri:#E4E5E8;
    --press:rgba(0,0,0,.045);--hero1:#D6E9FB;--hero2:#BBD8F6;--scrim:.12;
  }
  [data-theme=dark]{
    --bg:#0B0B0C;--card:#1C1C1E;--text:#F3F3F4;--text2:#9A9A9E;--text3:#9A9A9E;--sep:#2B2B2E;
    --search:#2A2A2D;--chev:#5C5C60;--switch-off:#4A4A4E;--bri:#2E2E31;
    --press:rgba(255,255,255,.06);--hero1:#20303F;--hero2:#182635;--scrim:.2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  @media (prefers-reduced-motion:reduce){ :root{--dur:.001s;--bar-dur:.001s;--sfade:.001s} .bigtitle{transition-duration:.001s!important} }
  html,body{height:100%;margin:0}
  body{
    background:#111;
    font-family:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .app{
    position:relative;width:390px;height:844px;background:#000;overflow:hidden;
    border-radius:38px;box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  @media (max-width:480px){
    .app{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
    body{display:block}
  }

  .page{position:absolute;inset:0;background:var(--bg);overflow:hidden}
  .page-settings{transition:transform var(--dur) var(--ease);will-change:transform}
  .app.pushed .page-settings{transform:translateX(-26%)}
  .scrim{
    position:absolute;inset:0;background:#000;opacity:0;
    transition:opacity var(--dur) var(--ease);pointer-events:none;z-index:30;
  }
  .app.pushed .scrim{opacity:var(--scrim)}

  .scroller{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:none;
    -webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--sb) + 56px),#000 calc(var(--sb) + 88px));
    mask-image:linear-gradient(to bottom,transparent calc(var(--sb) + 56px),#000 calc(var(--sb) + 88px));
  }
  .scroller::-webkit-scrollbar{width:0}
  .inner{will-change:transform}

  .appbar{
    position:absolute;left:0;right:0;top:var(--sb);height:62px;background:var(--bg);z-index:20;
    display:flex;align-items:center;padding:0 16px;
  }
  .bigtitle{
    position:absolute;left:16px;top:calc(var(--sb) + 60px);z-index:25;
    font-size:34px;font-weight:750;letter-spacing:.5px;color:var(--text);
    transform-origin:left top;will-change:transform;pointer-events:none;
    transition:opacity var(--sfade) linear;
  }

  .search{
    margin:0 16px 16px;height:43px;border-radius:22px;background:var(--search);
    display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--text2);
    font-size:15.5px;transform-origin:50% 100%;will-change:transform,opacity;
    backface-visibility:hidden;
    transition:opacity 0s linear var(--bar-dur);
  }
  .app.searching .search{opacity:0;transition:opacity 0s}
  .search{cursor:pointer}
  .search > *{transition:opacity .12s linear;will-change:opacity}
  .search .mic{margin-left:auto;color:#8A8A8E}
  [data-theme="dark"] .search .mic{color:#8E8E92}

  /* 搜索页：背景与内容单独淡入淡出，搜索框本体从首页栏位置移动到顶部 */
  .page-search{
    z-index:0;background:transparent;pointer-events:none;visibility:hidden;
    transition:visibility 0s linear var(--bar-dur);
  }
  .page-search::before{
    content:"";position:absolute;inset:0;background:var(--bg);opacity:0;
    transition:opacity var(--sfade) linear;
  }
  .page-search.on{pointer-events:auto;visibility:visible;transition:visibility 0s}
  .page-search.on::before{opacity:1}
  .sbar-wrap{
    position:absolute;left:0;right:0;top:0;height:calc(var(--sb) + 60px);z-index:20;
    display:flex;align-items:flex-start;padding:calc(var(--sb) + 8px) 16px 0;
    transform:translateY(var(--bar-dy,0px));
    transition:transform var(--bar-dur) var(--bar-ease);
  }
  .page-search.on .sbar-wrap{transform:translateY(0)}
  .sbar{
    flex:1;min-width:0;height:43px;border-radius:22px;background:var(--search);
    display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--text2);
    opacity:0;margin-right:0;
    transition:opacity 0s linear var(--bar-dur),margin-right var(--bar-dur) var(--bar-ease);
  }
  .page-search.on .sbar{
    opacity:1;margin-right:50px;
    transition:opacity 0s,margin-right var(--bar-dur) var(--bar-ease);
  }
  .sbar input{
    flex:1;min-width:0;margin:0;padding:0;border:0;outline:0;background:transparent;
    font:inherit;font-size:16.5px;color:var(--text);caret-color:#0066FE;
    -webkit-appearance:none;appearance:none;
  }
  .sbar input::placeholder{color:var(--text2)}
  .cancel{
    position:absolute;right:16px;top:calc(var(--sb) + 8px);width:38px;height:43px;
    padding:0;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:15.5px;letter-spacing:.2px;color:#0066FE;
    opacity:0;transform:translateX(6px);
    transition:opacity .16s linear,transform var(--bar-dur) var(--bar-ease);
  }
  .page-search.on .cancel{opacity:1;transform:none}
  .cancel:active{opacity:.5}

  .sclear{
    width:20px;height:20px;flex:0 0 auto;display:none;align-items:center;justify-content:center;
    padding:0;border:0;border-radius:50%;background:#A9ABAF;color:#fff;cursor:pointer;
  }
  .sclear svg{width:12px;height:12px;display:block}
  .sbar.has .sclear{display:flex}
  .sbar.has .mic{display:none}

  .sscroller{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:none;
    opacity:0;transition:opacity var(--sfade) linear;
    -webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--sb) + 50px),#000 calc(var(--sb) + 66px));
    mask-image:linear-gradient(to bottom,transparent calc(var(--sb) + 50px),#000 calc(var(--sb) + 66px));
  }
  .page-search.on .sscroller{opacity:1}
  .sscroller::-webkit-scrollbar{width:0}
  .sinner{padding:calc(var(--sb) + 60px) 0 calc(40px + env(safe-area-inset-bottom,0px))}

  .sug{margin:20px 16px 12px;font-size:16px;font-weight:600;color:var(--text)}
  .chips{display:flex;flex-wrap:wrap;gap:10px 8px;padding:0 16px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px 0 7px;
    border:0;border-radius:17px;background:var(--card);color:var(--text);
    font:inherit;font-size:14.5px;letter-spacing:.1px;cursor:pointer;
  }
  .chip:active{opacity:.65}
  .cico{width:20px;height:20px;flex:0 0 auto;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .cico svg{width:14px;height:14px;display:block;overflow:visible}

  .scard{background:var(--card);border-radius:15px;overflow:hidden;margin:8px 16px 0}
  .scard + .scard{margin-top:14px}
  .sghead{display:flex;align-items:center;gap:8px;padding:12px 16px 6px 12px}
  .sico{width:21px;height:21px;flex:0 0 auto;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .sico svg{width:13px;height:13px;display:block;overflow:visible}
  .sghead span{font-size:14px;color:var(--text)}
  .sghead span:last-child{opacity:.62}
  .srow{
    position:relative;display:flex;align-items:center;gap:10px;min-height:64px;
    padding:11px 14px 12px 16px;transition:background .12s ease;
  }
  .srow:active{background:var(--press)}
  .srow + .srow::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
  .stxt{flex:1;min-width:0}
  .stitle{font-size:16.5px;line-height:1.28;letter-spacing:.1px;color:var(--text)}
  .stitle .hl{color:#0066FE}
  .ssub{
    margin-top:4px;font-size:12.5px;line-height:1.3;color:var(--text2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .srow .chev{flex:0 0 auto}
  .nores{padding:70px 32px;text-align:center;font-size:14px;color:var(--text2)}

  .card{background:var(--card);border-radius:15px;overflow:hidden;margin:0 16px}
  .group{margin:0 16px 10px}
  .group:first-of-type{margin-top:0}

  .account{display:flex;align-items:center;gap:14px;padding:15px 16px}
  .avatar{
    width:44px;height:44px;border-radius:50%;flex:0 0 auto;position:relative;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:linear-gradient(150deg,#C4D2DF 0%,#9DAFBF 58%,#7C8F9F 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.06);
  }
  .avatar svg{width:26px;height:26px;color:#fff;opacity:.92;display:block}
  [data-theme="dark"] .avatar{
    background:linear-gradient(150deg,#3E4852 0%,#2E3841 58%,#232B33 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  }
  [data-theme="dark"] .avatar svg{color:#D7DDE3;opacity:.8}
  .acct-main{flex:1;min-width:0}
  .acct-title{
    font-size:17px;font-weight:600;line-height:1.2;color:var(--text);letter-spacing:.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .acct-sub{
    margin-top:5px;font-size:12.5px;line-height:1.2;color:var(--text2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .row{
    position:relative;display:flex;align-items:center;gap:12px;height:var(--row-h);padding:0 16px;
    transition:background .12s ease;
  }
  .row:active{background:var(--press)}
  .row + .row::before{
    content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--sep);
  }
  .ico{
    width:var(--ico-size);height:var(--ico-size);border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .ico svg{width:var(--glyph);height:var(--glyph);display:block;overflow:visible}
  .label{font-size:16.5px;color:var(--text);letter-spacing:.2px}
  .value{margin-left:auto;font-size:14px;color:var(--text3)}
  .chev{margin-left:auto;color:var(--chev);display:flex}
  .value + .chev{margin-left:6px}
  .chev svg{width:17px;height:17px;display:block}

  .sw{
    margin-left:auto;width:47px;height:28px;border-radius:14px;border:0;padding:0;
    background:var(--switch-off);position:relative;cursor:pointer;flex:0 0 auto;
    transition:background .2s cubic-bezier(.2,0,0,1);
  }
  .sw i{
    position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.22);
    transition:transform .2s cubic-bezier(.2,0,0,1);
  }
  .sw[aria-pressed="true"]{background:#0A84FF}
  .sw[aria-pressed="true"] i{transform:translateX(19px)}

  .push-hint{
    position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:20px;
    z-index:70;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;
    backdrop-filter:blur(8px);
  }
  .push-hint.on{opacity:1}

  .page-detail{
    transform:translateX(100%);border-radius:20px;background:var(--bg);
    transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    will-change:transform;box-shadow:none;backface-visibility:hidden;
  }
  .page-detail.is-top{transform:translateX(0);box-shadow:-16px 0 40px rgba(0,0,0,.38)}

  .page-detail .dinner{
    transform:translate3d(28px,0,0);opacity:.5;
    transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
  }
  .page-detail.is-top .dinner{transform:translate3d(0,0,0);opacity:1}

  .pick{display:flex;padding:20px 8px 12px}
  .tp{
    flex:1;min-width:0;border:0;background:transparent;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:11px;
  }
  .tp-art{
    width:78px;height:134px;border-radius:13px;position:relative;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 2px 8px rgba(30,60,90,.12);
  }
  .tp-art.lt{background:linear-gradient(165deg,#CDE9FB 0%,#ACD7F2 60%,#93C8EC 100%)}
  .tp-art.dk{background:linear-gradient(165deg,#22415B 0%,#2A5672 55%,#2E7B85 100%)}
  .tp-art .pa{position:absolute;border-radius:3px;background:rgba(255,255,255,.88)}
  .tp-art.dk .pa{background:rgba(228,242,252,.9)}
  .tp-art .p1{left:10px;top:13px;width:24px;height:6px}
  .tp-art .p2{right:10px;top:13px;width:18px;height:6px;opacity:.5}
  .tp-art .p3{left:10px;top:27px;width:58px;height:12px}
  .tp-art .p4{left:10px;top:45px;width:33px;height:7px;opacity:.6}
  .tp-art .p5{left:10px;top:60px;width:58px;height:24px;opacity:.8}
  .tp-art .p6{left:10px;bottom:14px;width:58px;height:9px;opacity:.6}
  .tp-art .p7{left:10px;bottom:30px;width:40px;height:7px;opacity:.45}
  .tp-name{font-size:14px;color:var(--text)}
  .tp.on .tp-name{color:#0066FE}
  .rd{
    width:19px;height:19px;border-radius:50%;box-sizing:border-box;
    border:1.7px solid var(--chev);transition:border-color .2s,background .2s,box-shadow .2s;
  }
  .tp.on .rd{
    border-color:#0066FE;background:#0066FE;
    box-shadow:inset 0 0 0 3.4px var(--card);
  }

  .bri{position:relative;height:38px;margin:12px 16px;border-radius:19px;background:var(--bri);overflow:hidden}
  .bri-fill{
    position:absolute;left:0;top:0;bottom:0;width:55%;border-radius:19px;background:#0066FE;
  }
  .bri-sun{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#fff;z-index:2}
  .bri input{
    position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:3;cursor:pointer;
    -webkit-appearance:none;appearance:none;background:transparent;
  }
  .bri input::-webkit-slider-runnable-track{height:38px;background:transparent}
  .bri input::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:transparent;opacity:0}
  .bri input::-moz-range-thumb{width:0;height:0;border:0;background:transparent}

  .row.tall{height:auto;padding-top:13px;padding-bottom:13px;align-items:center}
  .rcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .rcol .label{line-height:1.25}
  .sub{font-size:12.5px;line-height:1.35;color:var(--text2)}
  .card.nr .row + .row::before{left:16px}
  .devbar{
    position:absolute;left:0;right:0;top:var(--sb);height:56px;background:var(--bg);z-index:20;
    display:flex;align-items:center;gap:6px;padding:0 8px;
  }
  .back{
    width:44px;height:44px;border:0;background:transparent;color:var(--text);
    display:flex;align-items:center;justify-content:center;border-radius:22px;cursor:pointer;
  }
  .back:active{background:var(--press)}
  .back svg{width:24px;height:24px}
  .devbar h1{font-size:19px;font-weight:650;margin:0;color:var(--text)}
  .dscroller{
    position:absolute;inset:0;overflow-y:auto;
    -webkit-mask-image:linear-gradient(to bottom,transparent calc(var(--sb) + 52px),#000 calc(var(--sb) + 84px));
    mask-image:linear-gradient(to bottom,transparent calc(var(--sb) + 52px),#000 calc(var(--sb) + 84px));
  }
  .dscroller::-webkit-scrollbar{width:0}
  .dinner{padding-top:calc(var(--sb) + 60px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

  .hero{margin:6px 16px 0;background:var(--card);border-radius:15px;overflow:hidden}
  .hero-art{
    height:158px;margin:8px;border-radius:12px;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 30% 10%,var(--hero1),var(--hero2));
  }
  .hero-art .mon{
    position:absolute;left:50%;top:34px;transform:translateX(-50%);
    width:150px;height:84px;border-radius:5px;border:2px solid rgba(90,130,170,.45);
    background:linear-gradient(160deg,#CFE6FB,#A9CDF1);
  }
  .hero-art .mon::after{
    content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
    width:44px;height:2px;background:rgba(90,130,170,.45);border-radius:2px;
  }
  .hero-art .tab{
    position:absolute;left:76px;bottom:22px;width:54px;height:70px;border-radius:4px;
    border:2px solid rgba(90,130,170,.45);background:linear-gradient(160deg,#D6E9FB,#B4D4F2);
  }
  .hero-art .ph{
    position:absolute;left:190px;bottom:22px;width:34px;height:56px;border-radius:4px;
    border:2px solid rgba(90,130,170,.45);background:linear-gradient(160deg,#D9EBFC,#B7D6F3);
  }
  .hero-art .bar{position:absolute;height:4px;border-radius:2px;background:rgba(255,255,255,.75)}
  .hero-art .b1{left:88px;bottom:58px;width:30px}
  .hero-art .b2{left:200px;bottom:44px;width:18px}
  .hero-txt{padding:12px 16px 15px}
  .hero-row{display:flex;align-items:center}
  .hero-t1{font-size:17px;font-weight:600;color:var(--text)}
  .hero-t2{margin-top:3px;font-size:13px;color:var(--text2)}

  .sect{margin:18px 16px 8px;font-size:13px;color:var(--text2)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 16px}
  .gcard{background:var(--card);border-radius:15px;padding:14px 14px 16px;transition:background .12s}
  .gcard:active{background:var(--press)}
  .gcard .gico{height:26px;display:flex;align-items:center}
  .gcard .gico svg{width:24px;height:24px}
  .gcard h3{margin:9px 0 4px;font-size:16.5px;font-weight:600;color:var(--text)}
  .gcard p{margin:0;font-size:12.8px;line-height:1.45;color:var(--text2)}

</style>
</head>
<body>
<div class="app" id="app">

  <!-- 设置首页 -->
  <section class="page page-settings">
    <div class="scroller" id="scroller">
      <div class="inner" id="inner">
        <div style="height:calc(var(--sb) + 125px)"></div>
        <div class="search" id="homeSearch" role="button" aria-label="搜索设置项">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
            <circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.2 4.2"/>
          </svg>
          <span>搜索设置项</span>
          <svg class="mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="2.6" width="6" height="10.4" rx="3"/><path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0"/><path d="M12 17.8v3.4"/>
          </svg>
        </div>

        <div class="card account" id="accountCard">
          <div class="avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8.4" r="3.8" fill="currentColor"/>
              <path d="M12 13.6c-3.7 0-6.7 2.2-7.3 5.3-.1.6.4 1.1 1 1.1h12.6c.6 0 1.1-.5 1-1.1-.6-3.1-3.6-5.3-7.3-5.3z" fill="currentColor"/>
            </svg>
          </div>
          <div class="acct-main">
            <div class="acct-title">不认路、回家</div>
            <div class="acct-sub">管理账号、云服务、查找</div>
          </div>
          <div class="chev"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>

        <div style="height:10px"></div>
        <div id="groups"></div>
      </div>
    </div>

    <div class="bigtitle" id="bigtitle">设置</div>
    <div class="appbar"></div>
    <div class="scrim"></div>
  </section>

  <!-- 搜索 -->
  <section class="page page-search" id="searchPage" aria-hidden="true">
    <div class="sbar-wrap">

const scroller = $('scroller'), bigtitle = $('bigtitle'),
      searchEl = document.querySelector('.search'), searchInner = document.querySelectorAll('.search > *');
let raf = null;
function renderHeader(){
  raf = null;
  if($('app').classList.contains('searching')) return;
  const y = Math.max(0, scroller.scrollTop), tp = Math.min(1, y/115), cp = Math.min(1, y/60);
  /* 标题：34px → 19px（×0.5625），上移 46px，与滚动 1:1 线性 */
  bigtitle.style.transform = 'translate3d(0,' + (-46*tp).toFixed(2) + 'px,0) scale(' + (1-0.4375*tp).toFixed(4) + ')';
  /* 搜索框：底边为原点纵向压缩（43 → 0），60px 内收完，文字先行淡出 */
  searchEl.style.transform = 'scaleY(' + (1-cp).toFixed(3) + ')';
  const f = Math.max(0, 1 - cp*1.8).toFixed(3);
  searchInner.forEach(el => el.style.opacity = f);
}
scroller.addEventListener('scroll', () => {
  if(!$('app').classList.contains('searching')) bigtitle.style.transition = '';
  if(!raf) raf = requestAnimationFrame(renderHeader);
  if(!holding) armSnap();
}, {passive:true});
renderHeader();

/* 松手吸附：搜索框未压缩完（未过阈值）松手 → 回正；已完全压缩松手 → 头部吸顶（完全收起），超过则停在原地 */
const SNAP_FULL = 60;    /* 搜索框被完全压缩的位置 */
const SNAP_TOP = 115;    /* 标题完全收起、头部吸顶的位置 */
let snapRaf = 0, snapTimer = 0, holding = false, userScroll = false;
function stopSnap(){ if(snapRaf){ cancelAnimationFrame(snapRaf); snapRaf = 0; } }
function snapBack(){
  const from = scroller.scrollTop;
  if(snapRaf || from <= 0 || from >= SNAP_TOP) return;
  const to = from < SNAP_FULL ? 0 : SNAP_TOP;
  if(rm.matches){ scroller.scrollTop = to; return; }
  const t0 = performance.now(), dur = 340;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    scroller.scrollTop = from + (to - from) * e;
    snapRaf = k < 1 ? requestAnimationFrame(step) : 0;
  };
  snapRaf = requestAnimationFrame(step);
}
function armSnap(){
  if(snapRaf || holding || !userScroll) return;
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    const g = userScroll; userScroll = false;
    if(g && !holding && !$('app').classList.contains('searching')) snapBack();
  }, 60);
}
scroller.addEventListener('touchstart', () => { holding = true; userScroll = true; stopSnap(); clearTimeout(snapTimer); }, {passive:true});
scroller.addEventListener('mousedown', () => { holding = true; userScroll = true; stopSnap(); clearTimeout(snapTimer); });
['touchend','touchcancel'].forEach(ev => scroller.addEventListener(ev, () => { holding = false; armSnap(); }, {passive:true}));
window.addEventListener('mouseup', () => { if(holding){ holding = false; armSnap(); } });
scroller.addEventListener('wheel', () => { userScroll = true; stopSnap(); clearTimeout(snapTimer); }, {passive:true});
scroller.addEventListener('scrollend', () => { if(userScroll) armSnap(); });

/* 进入搜索：设置标题按正常的滚动收缩轨迹（缩小 + 上移）收起，而不是直接消失；退出时原路展开 */
let btTimer = 0;
function titleFlight(on){
  clearTimeout(btTimer);
  bigtitle.style.transition = 'transform var(--bar-dur) var(--bar-ease),opacity '
    + (on ? '.3s' : '.26s .05s') + ' linear';

const inner = $('inner'), MAX_PULL = 9;
let startY = null, pulling = false, acc = 0, resetTimer = null;
const applyPull = v => {
  inner.style.transition = 'none';
  inner.style.transform = 'translate3d(0,' + v.toFixed(2) + 'px,0)';
};
function springBack(){
  inner.style.transition = 'transform .15s cubic-bezier(.2,0,0,1)';
  inner.style.transform = 'translate3d(0,0,0)';
  acc = 0; pulling = false;
}
scroller.addEventListener('touchstart', e => {
  if(scroller.scrollTop <= 0){ startY = e.touches[0].clientY; acc = 0; }
}, {passive:true});
scroller.addEventListener('touchmove', e => {
  if(startY === null) return;
  const dy = e.touches[0].clientY - startY;
  if(dy <= 0 || scroller.scrollTop > 0){ if(!pulling) startY = null; return; }
  if(e.cancelable) e.preventDefault();
  pulling = true;
  acc = Math.min(MAX_PULL, dy*0.16);
  applyPull(acc);
}, {passive:false});
scroller.addEventListener('touchend', () => {
  startY = null;
  if(pulling) springBack();
}, {passive:true});
scroller.addEventListener('wheel', e => {
  if(scroller.scrollTop > 0 || e.deltaY >= 0) return;
  if(e.cancelable) e.preventDefault();
  acc = Math.min(MAX_PULL, acc + Math.abs(e.deltaY)*0.06);
  applyPull(acc);
  clearTimeout(resetTimer);
  resetTimer = setTimeout(springBack, 90);
}, {passive:false});

const app = $('app'), hint = $('hint');

const sp = $('searchPage'), si = $('searchInput'), sbar = $('sbar'),
      sr = $('sresults'), ssc = $('sscroller');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mark(t, q){
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(t)
    : esc(t.slice(0,i)) + '<span class="hl">' + esc(t.slice(i, i+q.length)) + '</span>' + esc(t.slice(i+q.length));
}
function renderSearch(){
  const q = si.value.trim();
  sbar.classList.toggle('has', !!si.value);
  ssc.scrollTop = 0;
  if(!q){
    sr.innerHTML = '<div class="sug">搜索建议</div><div class="chips">'
      + SUG.map(c => '<button class="chip" data-q="'+c[0]+'"><span class="cico" style="background:'+c[1]
        +'"><svg viewBox="0 0 24 24">'+ICONS[c[2]]+'</svg></span>'+c[0]+'</button>').join('') + '</div>';
    return;
  }
  const lq = q.toLowerCase(),
        hits = SINDEX.filter(r => (r[1] + ' ' + (r[3] || '')).toLowerCase().indexOf(lq) > -1);
  if(!hits.length){ sr.innerHTML = '<div class="nores">未找到与“' + esc(q) + '”相关的设置项</div>'; return; }
  let html = '', cur = '';
  hits.forEach(r => {
    if(r[0] !== cur){
      if(cur) html += '</div>';
      cur = r[0];
      const g = SG[cur];
      html += '<div class="scard"><div class="sghead"><span class="sico" style="background:' + g[1]
        + '"><svg viewBox="0 0 24 24">' + ICONS[g[2]] + '</svg></span><span>' + g[0] + '</span></div>';
    }
    html += '<div class="srow"' + (GO[cur] ? ' data-go="'+GO[cur]+'"' : '') + '><div class="stxt"><div class="stitle">'
      + mark(r[1], q) + '</div><div class="ssub">' + esc(r[2]) + '</div></div>' + CHEV + '</div>';
  });

}

const pageSet = document.querySelector('.page-settings'), scrimEl = document.querySelector('.scrim');
let edgeX = null, edgeY = null, dragging = false, scrimMax = .12;
const clearInline = p => [p, pageSet, scrimEl].forEach(el => {
  el.style.transition = ''; el.style.transform = ''; el.style.opacity = '';
});
Object.keys(pages).forEach(n => {
  const page = pages[n];

  page.addEventListener('touchstart', e => {
    if(page !== activeDetail) return;
    const t = e.touches[0];
    if(t.clientX < 40){
      edgeX = t.clientX; edgeY = t.clientY; dragging = false;
      scrimMax = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scrim')) || .12;
    }
  }, {passive:true});

  page.addEventListener('touchmove', e => {
    if(edgeX === null || page !== activeDetail) return;
    const t = e.touches[0], dx = t.clientX - edgeX, dy = Math.abs(t.clientY - edgeY);
    if(!dragging){
      if(dx > 8 && dx > dy){
        dragging = true;
        [page, pageSet, scrimEl].forEach(el => el.style.transition = 'none');
      }else if(dy > 12){ edgeX = null; return; }
      else return;
    }
    if(e.cancelable) e.preventDefault();
    const W = app.clientWidth, x = Math.max(0, Math.min(W, dx));
    page.style.transform = 'translate3d(' + x + 'px,0,0)';
    pageSet.style.transform = 'translate3d(' + (-0.26*W*(1-x/W)) + 'px,0,0)';
    scrimEl.style.opacity = (scrimMax*(1-x/W)).toFixed(3);
  }, {passive:false});

  page.addEventListener('touchend', e => {
    if(!dragging){ edgeX = null; return; }
    const dx = Math.max(0, Math.min(app.clientWidth, e.changedTouches[0].clientX - edgeX));
    const dismiss = dx > app.clientWidth*0.3;
    [page, pageSet, scrimEl].forEach(el => {
      el.style.transition = 'transform var(--dur) var(--ease), opacity var(--dur) var(--ease)';
    });
    requestAnimationFrame(() => {
      if(dismiss){
        page.style.transform = 'translate3d(100%,0,0)';
        pageSet.style.transform = 'translate3d(0,0,0)';
        scrimEl.style.opacity = '0';
      }else{
        page.style.transform = 'translate3d(0,0,0)';
        pageSet.style.transform = 'translate3d(-26%,0,0)';
        scrimEl.style.opacity = String(scrimMax);
      }
    });
    setTimeout(() => {
      clearInline(page);
      if(dismiss) closePage();
      dragging = false; edgeX = null;
    }, 320);
  }, {passive:true});
});

const root = document.documentElement, pickBtns = document.querySelectorAll('[data-pick]'),
      rm = matchMedia('(prefers-reduced-motion: reduce)');
let overlay = null, pendingTheme = null;

function applyTheme(t){
  root.dataset.theme = t;
  pickBtns.forEach(b => {
    const on = b.dataset.pick === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}

/* 切换时把「旧配色」整屏克隆成一层快照垫在最上层淡出：
   视觉上等同整屏交叉淡入，但只有合成层的透明度动画——页面不重绘、不抢事件，滚动照常。
   只克隆当前可见的那一页，避免整层栅格化内容过多导致切换瞬间出现白/黑色块。 */
function snapshot(appEl, theme){
  const r = appEl.getBoundingClientRect();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;z-index:99;pointer-events:none;'
    + 'transition:opacity .46s linear;will-change:opacity;opacity:1;contain:strict;'
    + 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;';
  wrap.dataset.theme = theme;
  const c = appEl.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  const pageEls = [...appEl.querySelectorAll('.page')],
        clones = [...c.querySelectorAll('.page')];
  let keep = pageEls.findIndex(p => p.classList.contains('is-top') && p.classList.contains('page-detail'));
  if(keep < 0) keep = pageEls.findIndex(p => p.classList.contains('on') && p.classList.contains('page-search'));
  if(keep < 0) keep = pageEls.findIndex(p => p.classList.contains('page-settings'));
  if(keep < 0) keep = 0;
  const kept = clones[keep];
  clones.forEach((p, i) => { if(i !== keep) p.remove(); });
  /* 详情页四角是圆角，会透出下层（首页位移后的底色 + 遮罩，或搜索页底色）：补一块等效背板 */
  if(kept && kept.classList.contains('page-detail')){
    const back = document.createElement('div');
    const sOpen = !!appEl.querySelector('.page-search.on');
    back.style.cssText = 'position:absolute;inset:0;background:var(--bg);transform:' + (sOpen ? 'none' : 'translateX(-26%)');
    if(!sOpen){
      const s = document.createElement('div');
      s.className = 'scrim';
      back.appendChild(s);
    }
    c.insertBefore(back, kept);
  }
  wrap.dataset.pageIndex = String(keep);
  c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;margin:0;box-shadow:none';
  wrap.appendChild(c);
  document.body.appendChild(wrap);
  const src = pageEls[keep];
  if(src && kept){
    const os = src.querySelectorAll('.scroller,.dscroller,.sscroller'),
          ns = kept.querySelectorAll('.scroller,.dscroller,.sscroller');
    os.forEach((o, i) => { if(ns[i]) ns[i].scrollTop = o.scrollTop; });
    src.querySelectorAll('input').forEach((o, i) => {
      const n = kept.querySelectorAll('input')[i];
      if(n) n.value = o.value;
    });
  }
  return wrap;
}

function setTheme(t, el){
  if(!el || rm.matches) return applyTheme(t);
  /* 正在切换：记下目标色，等这一轮淡出结束后再切 */
  if(overlay){ pendingTheme = t; return; }
  if(root.dataset.theme === t) return;

  let ov = null, keep = 0;
  try{ ov = snapshot($('app'), root.dataset.theme); keep = +ov.dataset.pageIndex || 0; }catch(e){}
  if(!ov) return applyTheme(t);

  overlay = ov;
  pendingTheme = t;

  /* 淡出期间页面照常滚动：快照同步滚动，两层不错位才不会出现白块 */
  const pageEls = $('app').querySelectorAll('.page'),
        live = pageEls[keep] ? pageEls[keep].querySelectorAll('.scroller,.dscroller,.sscroller') : [],
        snap = ov.querySelectorAll('.scroller,.dscroller,.sscroller');
  live.forEach((o, i) => { if(snap[i]) snap[i].scrollTop = o.scrollTop; });
  const sync = () => live.forEach((o, i) => {
    if(snap[i] && snap[i].scrollTop !== o.scrollTop) snap[i].scrollTop = o.scrollTop;
  });
  live.forEach(o => o.addEventListener('scroll', sync, {passive:true}));

  let dropped = false;
  const drop = e => {
    if(e && e.target !== ov) return;
    if(dropped) return;
    dropped = true;
    live.forEach(o => o.removeEventListener('scroll', sync));
    ov.remove();
    if(overlay === ov) overlay = null;
    const next = pendingTheme;
    pendingTheme = null;
    if(next && next !== root.dataset.theme) setTheme(next, 1);
  };
  ov.addEventListener('transitionend', drop, {once:true});
  setTimeout(drop, 700);

  /* 先把快照按旧配色完整画出来（此时与页面逐像素一致，用户看不到变化），
     再改配色并开始淡出——避免页面重绘与快照首帧栅格化之间的空档闪白/闪黑 */
  const t0 = performance.now();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    setTimeout(() => {
      if(dropped) return;
      const target = pendingTheme;
      pendingTheme = null;
      if(!target || target === root.dataset.theme){ drop(); return; }
      applyTheme(target);
      sync();
      void ov.offsetWidth;
      ov.style.opacity = '0';
    }, Math.max(0, 40 - (performance.now() - t0)));
  }));
}
applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
pickBtns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.pick, b)));
